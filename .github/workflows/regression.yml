name: regression

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP unit (domain polymorphism) — containerized
        run: |
          docker compose -f compose.yml -f compose.test.yml build backend-test
          docker compose -f compose.yml -f compose.test.yml run --rm backend-test
      - name: Start stack
        run: |
          cp .env.example .env.development
          docker compose up --build -d mysql php-apache frontend
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 5
          done
          exit 1
      - name: Full regression (smoke + api + contract + db + integration) — containerized
        run: |
          docker compose -f compose.yml -f compose.test.yml build qa-test
          docker compose -f compose.yml -f compose.test.yml run --rm qa-test \
            pytest tests/smoke tests/api tests/contract tests/database tests/integration -q --junitxml=reports/junit.xml
          docker compose -f compose.yml -f compose.test.yml run --rm qa-test \
            python qa/analytics.py reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-reports
          path: |
            reports/junit.xml
            reports/qa-metrics.json
