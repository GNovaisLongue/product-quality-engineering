name: regression

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql
          tools: composer:2.8
      - name: PHP unit (domain polymorphism)
        working-directory: backend
        run: |
          composer install --no-interaction
          ./vendor/bin/phpunit --testsuite unit
      - name: Start stack
        run: |
          cp .env.example .env.development
          docker compose up --build -d mysql php-apache
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full regression (smoke + api + contract + db + integration)
        run: |
          pip install pytest requests pymysql pyyaml jsonschema
          python -m pytest tests/smoke tests/api tests/contract tests/database tests/integration -q --junitxml=reports/junit.xml
          python qa/analytics.py reports/junit.xml
      - uses: actions/upload-artefact@v4
        if: always()
        with:
          name: regression-reports
          path: |
            reports/junit.xml
            reports/qa-metrics.json
