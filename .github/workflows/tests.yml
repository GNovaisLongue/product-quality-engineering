name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP domain unit tests (containerized — no host PHP/composer needed)
        run: |
          docker compose -f compose.yml -f compose.test.yml build backend-test
          docker compose -f compose.yml -f compose.test.yml run --rm backend-test

  smoke-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env.development
          docker compose up --build -d mysql php-apache
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 5
          done
          exit 1
      - name: Run smoke + API suites (containerized — no host Python needed)
        run: |
          docker compose -f compose.yml -f compose.test.yml build qa-test
          docker compose -f compose.yml -f compose.test.yml run --rm qa-test \
            pytest tests/smoke tests/api -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-pr
          path: reports/junit.xml
