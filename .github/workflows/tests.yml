name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql
          tools: composer:2.8
      - working-directory: backend
        run: |
          composer install --no-interaction
          ./vendor/bin/phpunit --testsuite unit

  smoke-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env.development
          docker compose up --build -d mysql php-apache
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run smoke + API suites
        run: |
          pip install pytest requests pymysql pyyaml jsonschema
          python -m pytest tests/smoke tests/api -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-pr
          path: reports/junit.xml
